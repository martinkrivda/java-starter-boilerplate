apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java-starter-boilerplate.fullname" . }}
  labels:
    {{- include "java-starter-boilerplate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "java-starter-boilerplate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "java-starter-boilerplate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.containerPort | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "java-starter-boilerplate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "java-starter-boilerplate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TLS_ENABLED
              value: {{ .Values.tls.enabled | quote }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_PATH
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.certFile }}
            - name: TLS_KEY_PATH
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.keyFile }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "java-starter-boilerplate.fullname" . }}
            {{- $secretName := include "java-starter-boilerplate.secretName" . }}
            {{- if $secretName }}
            - secretRef:
                name: {{ $secretName }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    scheme=http; [ "$TLS_ENABLED" = "true" ] && scheme=https
                    curl -fsSk -X POST ${scheme}://127.0.0.1:8080/health/drain || true; sleep 10
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
            {{- if .Values.tls.enabled }}
            scheme: HTTPS
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
            {{- if .Values.tls.enabled }}
            scheme: HTTPS
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tls.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tls.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
