# yaml-language-server: $schema=values.schema.json

global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

replicaCount: 2

image:
  repository: java-starter-boilerplate
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

env:
  MICRONAUT_ENVIRONMENTS: "prod,postgresql"
  APP_NAME: "java-starter-boilerplate"
  LOG_TARGET: "stdout"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "starter"
  DB_POOL_MAX_SIZE: "10"
  STORAGE_S3_ENABLED: "true"
  STORAGE_S3_ENDPOINT: "http://minio:9000"
  STORAGE_S3_REGION: "eu-central-1"
  STORAGE_S3_BUCKET: "starter-documents"
  STORAGE_S3_PATH_STYLE_ACCESS: "true"
  PDFBOX_ENABLED: "true"
  DSS_ENABLED: "true"

existingSecret: ""

# Native Micronaut TLS (TLS_ENABLED env var), fed from a cert-manager-issued Secret
# (tls.crt / tls.key) mounted read-only into the container. Micronaut 4.x cannot serve
# HTTP and HTTPS on separate ports from one process, so enabling this switches the whole
# app - including /healthz, /readyz and /metrics - to HTTPS on the same containerPort.
# The Service is unaffected: it proxies TCP and does not care which scheme the backend speaks.
tls:
  enabled: false
  secretName: ""
  mountPath: /etc/tls
  certFile: tls.crt
  keyFile: tls.key

# Extra volumes/mounts for cases the built-in tls.* hook doesn't cover
# (e.g. a second secret, a ConfigMap, an emptyDir) without editing the templates.
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: java-starter-boilerplate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  targetName: ""
  data: []

nodeSelector: {}
tolerations: []
affinity: {}
